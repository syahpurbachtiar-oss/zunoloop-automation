name: ZunoLoop daily video pipeline

on:
  workflow_dispatch:
    inputs:
      reviewed_plan:
        description: Optional reviewed plans JSON path
        required: false
        type: string
      publish_ready:
        description: Publish completed videos from a prior run without generating again
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: Optional prior run with incomplete Agnes videos
        required: false
        type: string
  schedule:
    # 07:00 WIB leaves time for a busy video queue before the 12:00 post.
    - cron: '0 0 * * *'

concurrency:
  group: zunoloop-daily
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    permissions:
      actions: read
      contents: read
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      PYTHONUNBUFFERED: '1'
      REVIEWED_PLAN: ${{ inputs.reviewed_plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Validate prior run identifier
        if: inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: zunoloop-${{ inputs.resume_run_id }}
          path: output/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Research and generate four Agnes videos
        if: inputs.publish_ready != true
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -m zunoloop.pipeline; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then break; fi
            echo "Generation attempt $attempt failed; keeping completed media and retrying in 90 seconds"
            sleep 90
          done
          exit 1
      - name: Keep previews for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zunoloop-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    if: always() && !cancelled() && vars.LIVE_PUBLISH == 'true' && (needs.create.result == 'success' || needs.create.result == 'failure')
    needs: create
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.BUFFER_YOUTUBE_CHANNEL_ID }}
      LIVE_PUBLISH: ${{ vars.LIVE_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: zunoloop-${{ github.run_id }}
          path: output/
      - name: Keep a week of public videos
        run: |
          mkdir -p site/media
          cp output/*.mp4 site/media/
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          cutoff = date.today() - timedelta(days=7)
          for video in Path('site/media').glob('*.mp4'):
              try:
                  if date.fromisoformat(video.name[:10]) < cutoff:
                      video.unlink()
              except ValueError:
                  raise RuntimeError('Unexpected media filename: ' + video.name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/media
          if ! git diff --cached --quiet; then git commit -m "Update public ZunoLoop video media" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Schedule completed videos via Buffer
        env:
          MEDIA_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSI "${MEDIA_BASE_URL%/}/media/$(find output -maxdepth 1 -name '*.mp4' -printf '%f\n' | head -1)" >/dev/null; then break; fi
            sleep 10
          done
          python -m zunoloop.pipeline --publish
